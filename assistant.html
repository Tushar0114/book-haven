<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Book Haven AI Assistant</title>
  <style>
    body {
      font-family: Arial;
      background: #0f172a;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #chatbox {
      width: 400px;
      height: 500px;
      overflow-y: auto;
      border: 1px solid #444;
      padding: 10px;
      margin-top: 20px;
    }

    input {
      width: 300px;
      padding: 10px;
    }

    button {
      padding: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<h2>🤖 Book Haven AI Assistant</h2>

<div id="chatbox"></div>

<input id="input" placeholder="Ask something..." />
<button onclick="send()">Send</button>

<script>
async function send() {
  let input = document.getElementById("input").value;
  let chatbox = document.getElementById("chatbox");

  chatbox.innerHTML += "<p><b>You:</b> " + input + "</p>";

  const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
    method: "POST",
    headers: {
      "Authorization": "Bearer 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",
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      model: "openai/gpt-oss-120b:free",
      messages: [{ role: "user", content: input }]
    })
  });

  const data = await response.json();
  const reply = data.choices[0].message.content;

  chatbox.innerHTML += "<p><b>AI:</b> " + reply + "</p>";
}
</script>

</body>
</html>
